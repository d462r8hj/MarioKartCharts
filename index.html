<script>
  /*
    Zusatzblock: Abstand zum jeweils besseren Platz
    Einfügen ganz unten direkt vor </body>.
  */

  (function addGapColumnToLeaderboard() {
    function ensureGapHeader() {
      const table = document.querySelector(".leaderboard-table");
      if (!table) return;

      const headRow = table.querySelector("thead tr");
      if (!headRow) return;

      const headers = Array.from(headRow.children);
      const alreadyExists = headers.some((th) => th.textContent.trim().toLowerCase() === "abstand");
      if (alreadyExists) return;

      const trendHeader = headers.find((th) => th.textContent.trim().toLowerCase() === "trend");
      const gapTh = document.createElement("th");
      gapTh.className = "num";
      gapTh.textContent = "Abstand";

      if (trendHeader) {
        headRow.insertBefore(gapTh, trendHeader);
      } else {
        headRow.appendChild(gapTh);
      }
    }

    function ensureGapStyles() {
      if (document.getElementById("gap-column-style")) return;

      const style = document.createElement("style");
      style.id = "gap-column-style";
      style.textContent = `
        .leaderboard-table {
          min-width: 1220px;
        }

        .leaderboard-table th:nth-child(9),
        .leaderboard-table td:nth-child(9) {
          width: 118px !important;
        }

        .leaderboard-table th:nth-child(10),
        .leaderboard-table td:nth-child(10) {
          width: 104px !important;
        }

        .leaderboard-table th:nth-child(11),
        .leaderboard-table td:nth-child(11) {
          width: 78px !important;
        }

        .gap-to-ahead {
          color: #253061;
          font-weight: 800;
          font-variant-numeric: tabular-nums;
        }

        .gap-to-ahead.is-leader {
          color: #5f6893;
          font-weight: 800;
        }

        body.game-mkworld .gap-to-ahead {
          color: #0d5278;
        }

        @media (max-width: 620px) {
          .leaderboard-table {
            min-width: 0;
          }
        }
      `;
      document.head.appendChild(style);
    }

    function formatGapToAhead(gap) {
      if (gap === null || typeof gap === "undefined") return "-";
      return `${gap.toLocaleString("de-DE")} Pkt.`;
    }

    /*
      renderTable wird komplett ersetzt, aber nutzt weiterhin deine bestehenden Funktionen:
      rankByWeek, currentSeasonKey, trendClass, handicapClass, formatMultiplier,
      displayName, faceObjectPosition, FALLBACK_AVATAR usw.
    */
    window.renderTable = function renderTableWithGap() {
      const weekIndex = state.selectedWeekIndex;
      const current = rankByWeek(weekIndex);
      const prevMap = new Map();

      if (weekIndex > 0) {
        rankByWeek(weekIndex - 1).forEach((p) => prevMap.set(p.id, p.rank));
      }

      ensureGapHeader();
      ensureGapStyles();

      el.leaderboardBody.innerHTML = "";

      const currentSeason = currentSeasonKey();
      const isCurrentSeason = state.selectedSeasonKey === currentSeason;

      current.forEach((p, idx) => {
        const prevRank = prevMap.get(p.id) ?? p.rank;
        const delta = prevRank - p.rank;

        const aheadPlayer = idx > 0 ? current[idx - 1] : null;
        const gapToAhead = aheadPlayer
          ? Math.max(0, aheadPlayer.pointsTotal - p.pointsTotal)
          : null;

        const tr = document.createElement("tr");

        if (!isCurrentSeason) {
          if (p.rank === 1) tr.classList.add("rank-1");
          else if (p.rank === 2) tr.classList.add("rank-2");
          else if (p.rank === 3) tr.classList.add("rank-3");
        }

        tr.innerHTML = `
          <td class="rank">${p.rank}</td>

          <td>
            <div class="player">
              ${p.avatar || FALLBACK_AVATAR}
              <div>
                <div class="player-name">${displayName(p)}</div>
                <small class="player-meta">${p.name}</small>
              </div>
            </div>
          </td>

          <td class="num" data-label="Fahrpunkte">
            ${p.rawPointsWeek.toLocaleString("de-DE")}
          </td>

          <td class="num" data-label="Multiplikator">
            <span class="multiplier-line">
              ${formatMultiplier(p.multiplierWeek)}
              <small class="multiplier-sub">
                ${weekIndex === 0 ? " · W1" : ` · WP ${p.referenceRankWeek}`}
              </small>
            </span>
          </td>

          <td class="num ${handicapClass(p.handicapPointsWeek)}" data-label="Handicap">
            ${p.handicapPointsWeek > 0 ? "+" : ""}${p.handicapPointsWeek.toLocaleString("de-DE")}
          </td>

          <td class="num" data-label="Gewertet">
            ${p.pointsWeek.toLocaleString("de-DE")}
          </td>

          <td class="num" data-label="Gesamt">
            ${p.pointsTotal.toLocaleString("de-DE")}
          </td>

          <td class="num ${handicapClass(p.handicapPointsTotal)}" data-label="HCP gesamt">
            ${p.handicapPointsTotal > 0 ? "+" : ""}${p.handicapPointsTotal.toLocaleString("de-DE")}
          </td>

          <td class="num" data-label="Ohne HCP">
            ${p.rawRank}.<small class="raw-rank-sub">${p.rawPointsTotal.toLocaleString("de-DE")} Pkt.</small>
          </td>

          <td class="num gap-to-ahead ${gapToAhead === null ? "is-leader" : ""}" data-label="Abstand">
            ${formatGapToAhead(gapToAhead)}
          </td>

          <td class="num ${trendClass(delta)}" data-label="Trend">
            ${delta > 0 ? "+" : ""}${delta}
          </td>
        `;

        el.leaderboardBody.appendChild(tr);
      });
    };

    ensureGapHeader();
    ensureGapStyles();

    if (window.state && state.players && state.players.length && typeof render === "function") {
      render();
    }
  })();
</script>
